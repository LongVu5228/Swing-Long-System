<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTF Daily Summary</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/scr_common.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#131722; --muted:#787b86; --line:#e0e3eb; --soft:#f0f3fa; --chip:#f0f3fa;
          --accent:#2962ff; --green:#089981; --red:#f23645; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:13px -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px 6px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; font-weight:700; }
  a { color:inherit; }
  button, select, input { font:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--fg); border-radius:6px; padding:5px 10px; }
  button:hover { background:var(--soft); }
  button:disabled { opacity:.4; cursor:default; }
  .datebox { display:flex; align-items:center; gap:4px; }
  .datebox input, select { padding:4px 6px; border:1px solid var(--line); border-radius:6px; }
  .back { text-decoration:none; padding:5px 10px; border:1px solid var(--line); border-radius:16px; }
  .back:hover { background:var(--soft); }
  .muted { color:var(--muted); font-size:12px; }
  .strip { display:flex; gap:8px; padding:6px 16px 10px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .stat { border:1px solid var(--line); border-radius:8px; padding:6px 12px; min-width:110px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:11px; }
  .trades { padding:8px 16px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .trades .t { border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
  .trades .t.Triggered { background:#e3ebff; } .trades .t.Stopped { background:#fdecee; }
  .trades .t.Exited { background:#e6f4f1; } .trades .t.Partial { background:#fff8e1; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:10px; padding:10px 16px; }
  .col { border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; min-height:0; }
  .col h2 { margin:0; font-size:13px; padding:8px 10px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:6px; }
  .col h2 .n { color:var(--muted); font-weight:400; }
  .col h2 .avg { margin-left:auto; font-size:11px; font-weight:700; }
  .col .sub { color:var(--muted); font-size:11px; padding:4px 10px 0; }
  .col .rows { overflow-y:auto; overflow-x:hidden; padding:4px 6px 8px; }
  .row { display:flex; align-items:center; gap:5px; padding:4px; border-radius:5px; white-space:nowrap; }
  .row:hover { background:var(--soft); }
  .row a.tk { font-weight:700; text-decoration:none; min-width:52px; }
  .row a.tk:hover { color:var(--accent); }
  .chip { font-size:10px; font-weight:700; padding:1px 4px; border-radius:3px; background:var(--chip); color:var(--muted); }
  .chip.w1M { background:#e3ebff; color:#1e4fd8; } .chip.w3M { background:#efe8fb; color:#5e35b1; } .chip.w6M { background:#e0f2ef; color:#00695c; }
  .row .f { margin-left:auto; display:flex; gap:6px; align-items:baseline; }
  .pct { font-weight:700; font-size:12px; min-width:48px; text-align:right; }
  .up { color:var(--green); } .dn { color:var(--red); }
  .ru { color:var(--muted); font-size:11px; min-width:44px; text-align:right; }
  .empty { color:var(--muted); padding:10px; }
  .row .dd { border:0; background:none; padding:0 2px; color:var(--muted); font-size:11px; width:16px; }
  .row .dd:hover { color:var(--fg); background:none; }
  .row.open { background:var(--soft); }
  .sumchart { height:230px; margin:2px 0 8px; border:1px solid var(--line); border-radius:6px; position:relative; }
  .search { display:flex; align-items:center; gap:4px; }
  .search input { width:110px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; text-transform:uppercase; }
  .row.hit { background:#fff8e1; }
  .hide { display:none !important; }
  .tag { font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; background:#eef0f3; color:#434651; }
  .tag.BG, .tag.SG { background:#e6f4f1; color:#087f6b; }
  .tag.PF, .tag.BPF { background:#efe8fb; color:#5e35b1; }
  .tag.DT { background:#fdecee; color:#c62828; }
  .tag.UT { background:#fff1e0; color:#b35c00; }
  .tag.NA { background:#f0f1f3; color:#9598a1; text-decoration:line-through; }
  .row .tgs { display:inline-flex; gap:3px; }
  .row .tagbtn { border:0; background:none; padding:0 2px; font-size:11px; opacity:.35; }
  .row:hover .tagbtn, .row .tagbtn.has { opacity:1; }
  .tagmenu { position:fixed; z-index:50; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px;
             box-shadow:0 4px 14px rgba(0,0,0,.12); display:flex; flex-wrap:wrap; gap:4px; width:220px; }
  .tagmenu .hdr { width:100%; font-size:11px; color:var(--muted); margin-bottom:2px; }
  .tagmenu button { padding:2px 8px; font-size:12px; border-radius:12px; }
  .tagmenu button.on { background:#131722; color:#fff; border-color:#131722; }
  .tagmenu input { width:100%; margin-top:4px; font-size:12px; padding:3px 6px; border:1px solid var(--line); border-radius:5px; }
  .col h2 .ex { font-size:11px; padding:1px 7px; border-radius:4px; font-weight:400; }
  @media (max-width: 1100px) { main { grid-template-columns:repeat(2, minmax(0, 1fr)); overflow:auto; } .col { max-height:420px; } }
</style>
</head>
<body>
<header>
  <a class="back" href="/screener" id="backLink">← Screener</a>
  <h1>Daily summary</h1>
  <div class="datebox">
    <button id="prev" title="Previous session (←)">◀</button>
    <input id="date" type="date">
    <button id="next" title="Next session (→)">▶</button>
    <button id="latest">Latest</button>
  </div>
  <label class="muted">Armed list
    <select id="mode"><option value="live">Live</option><option value="replay">Practice</option></select></label>
  <span class="search"><input id="q" placeholder="Find ticker" autocomplete="off" title="Type a ticker; Esc clears. Shortcut: /"><button id="qGo" title="Search">🔍</button><button id="qClr" title="Clear">✕</button></span>
  <span class="muted" id="qMsg"></span>
  <span class="muted" id="thru"></span>
</header>
<div class="strip" id="strip"></div>
<div class="trades" id="trades"></div>
<main id="cols"></main>
<script>
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return localStorage.getItem("sum_" + k) ?? d; } catch (e) { return d; } };
const keep = (k, v) => { try { localStorage.setItem("sum_" + k, v); } catch (e) {} };
const COLS = [
  ["new", "New", "On a Today list for the first time ever"],
  ["back_grad", "Back from Graduates", "Off the lists within the last 63 sessions, back on Today"],
  ["back_backlog", "Back from Backlog", "Off the lists for more than 63 sessions (or moved by hand), back on Today"],
  ["out_grad", "Today → Graduates", "On Today yesterday, on no list today"],
  ["aged", "Graduates → Backlog", "Last list day fell out of the 63-session window (or you moved it)"],
];
const S = {dates: [], date: null, mode: load("mode", "live"), tags: {vocab: [], tickers: {}}};
const tagsOf = t => S.tags.tickers[t] || [];
const tagChips = t => tagsOf(t).map(x => `<span class="tag ${x.replace("/", "")}">${x}</span>`).join("");
const pct = v => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const cls = v => v == null ? "" : v >= 0 ? "up" : "dn";
const chips = ls => (ls || []).map(l => { const [w, b] = l.split(" "); return `<span class="chip w${w}">${w} ${b.slice(0, 2)}</span>`; }).join("");
const chartUrl = t => `/chart?t=${encodeURIComponent(t)}&asof=${S.date}&mode=${S.mode}`;

async function show(d) {
  S.date = d; $("date").value = d; keep("date", d);
  history.replaceState(null, "", `/summary?date=${d}`);
  $("backLink").href = `/screener?date=${d}`;
  $("cols").innerHTML = `<div class="empty">Loading ${d} …</div>`;
  let s;
  try { s = await getJSON(`/api/scr/summary?date=${d}&mode=${S.mode}`); }
  catch (e) { $("cols").innerHTML = `<div class="empty">Error: ${e.message}</div>`; return; }
  if (S.date !== d) return;
  $("prev").disabled = !s.prev; $("next").disabled = !s.next;
  S.prev = s.prev; S.next = s.next;
  $("thru").textContent = d === s.upto ? "Latest day: follow-up starts tomorrow" : `Follow-up: close ${d} → close ${s.upto}`;
  const c = s.counts;
  const stats = [["today", "On Today", c.today], ["new", "New", c.new], ["back", "Back on Today", c.back_grad + c.back_backlog],
                 ["out", "Today → Grads", c.out_grad], ["aged", "Grads → Backlog", c.aged], ["trades", "Trade events", c.trades]];
  $("strip").innerHTML = stats.map(([k, lab, v]) => `<div class="stat"><b>${v}</b><span>${lab}</span></div>`).join("");
  const T = s.groups.trades;
  $("trades").innerHTML = `<b style="margin-right:4px">Trades</b>` + (T.length ? T.map(t =>
      `<span class="t ${t.kind.split(" ")[0]}"><a href="${chartUrl(t.ticker)}" target="_blank" rel="noopener"><b>${t.ticker}</b></a> ` +
      `${t.kind}${t.R != null ? ` ${t.R >= 0 ? "+" : ""}${t.R}R` : ""}${t.note ? " (" + t.note + ")" : ""}` +
      `${t.fill ? ` <span class="muted">@ ${fmt.px(t.fill)}</span>` : ""}</span>`).join("")
    : `<span class="muted">No armed ticker triggered, hit +20% or closed this day (daily-bar estimate).</span>`);
  $("cols").innerHTML = COLS.map(([k, lab, tip]) => {
    const rows = s.groups[k];
    const vals = rows.map(r => r.chg).filter(v => v != null);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    return `<div class="col"><h2 title="${tip}">${lab} <span class="n">${rows.length}</span>` +
      `<span class="avg ${cls(avg)}" title="Average % since ${d}">${avg == null ? "" : "avg " + pct(avg)}</span>` +
      (rows.length ? `<button class="ex" data-ex="1" title="Open / close every chart in this column">Charts ▸</button>` : "") + `</h2>` +
      `<div class="sub">${tip}</div><div class="rows">` +
      (rows.length ? rows.map(r => `<div class="row" data-t="${r.ticker}" title="${r.last_seen ? "last on a list " + r.last_seen : ""}${r.why ? " · " + r.why : ""}">` +
        `<button class="dd" title="Show the chart">▸</button><a class="tk" href="${chartUrl(r.ticker)}" target="_blank" rel="noopener">${r.ticker}</a>${chips(r.lists)}<span class="tgs">${tagChips(r.ticker)}</span>` +
        (r.why === "moved by hand" ? `<span class="chip">by hand</span>` : "") +
        `<span class="f"><button class="tagbtn ${tagsOf(r.ticker).length ? "has" : ""}" title="Tags">🏷</button><span class="pct ${cls(r.chg)}" title="Close ${d} → close ${r.through || ""}">${pct(r.chg)}</span>` +
        `<span class="ru" title="Best high since ${d}">${r.runup == null ? "" : "↑" + Math.max(0, r.runup * 100).toFixed(0) + "%"}</span></span></div>`).join("")
        : `<div class="empty">none</div>`) + `</div></div>`;
  }).join("");
  S.upto = s.upto; S.charts.forEach(h => h.chart.remove()); S.charts = [];
  applySearch();
}

// bars requests go 3 at a time, top rows first, so "Charts ▸" on a long column fills in from the top quickly
const BQ = {run: 0, q: [], cache: new Map()};
function barsQueued(t, asof) {
  const k = t + "|" + asof;
  if (BQ.cache.has(k)) return BQ.cache.get(k);
  const pr = new Promise((res, rej) => { BQ.q.push({t, asof, res, rej}); pump(); });
  BQ.cache.set(k, pr); pr.catch(() => BQ.cache.delete(k));
  return pr;
}
function pump() {
  while (BQ.run < 3 && BQ.q.length) {
    const j = BQ.q.shift(); BQ.run++;
    getJSON(`/api/scr/bars?t=${encodeURIComponent(j.t)}&asof=${j.asof}`).then(j.res, j.rej).finally(() => { BQ.run--; pump(); });
  }
}
// ---- chart dropdown: ▸ opens a 3M daily chart under the row (through the latest day), marking this summary's day
S.charts = [];
async function toggleChart(row, want) {
  const nx = row.nextElementSibling;
  const isOpen = !!(nx && nx.classList.contains("sumchart"));
  if (want !== undefined && want === isOpen) return;
  if (isOpen) {
    const h = S.charts.find(x => x.box === nx); if (h) { h.chart.remove(); S.charts = S.charts.filter(x => x !== h); }
    nx.remove(); row.classList.remove("open"); row.querySelector(".dd").textContent = "▸"; return;
  }
  const t = row.dataset.t, day = S.date;
  const box = document.createElement("div"); box.className = "sumchart"; box.innerHTML = `<div class="empty">loading ${t} …</div>`;
  row.after(box); row.classList.add("open"); row.querySelector(".dd").textContent = "▾";
  try {
    const p = await barsQueued(t, S.upto);
    await drawingsLoad([t]);
    if (!box.isConnected || S.date !== day) return;
    box.innerHTML = "";
    const h = buildChart(box, p, "3M", {small: true});
    h.box = box;
    const mark = () => { if (h.bars.some(b => b[0] === day)) h.candles.setMarkers([{time: day, position: "belowBar", color: "#2962ff", shape: "arrowUp", text: day.slice(5)}]); };
    h.after.push(mark); mark();
    attachDrawings(h, t);
    S.charts.push(h);
  } catch (e) { box.innerHTML = `<div class="empty">no bars for ${t}</div>`; }
}
document.addEventListener("click", e => {
  const b = e.target.closest(".row .dd"); if (b) return toggleChart(b.closest(".row"));
  const ex = e.target.closest("[data-ex]");
  if (ex) {                                  // per column: open every (visible) chart, or close them all
    const rows = [...ex.closest(".col").querySelectorAll(".row[data-t]:not(.hide)")];
    const open = !rows.every(r => r.classList.contains("open"));
    rows.forEach(r => toggleChart(r, open));
    ex.textContent = open ? "Charts ▾" : "Charts ▸";
    return;
  }
  const tb = e.target.closest(".row .tagbtn");
  if (tb) { const m = $("tagMenu"); const t = tb.closest(".row").dataset.t;
            if (m && m.dataset.for === t) closeTagMenu(); else openTagMenu(tb, t); return; }
  if (!e.target.closest("#tagMenu")) closeTagMenu();
});

// ---- tags: same tags.json as the screener; the rows update when the menu closes
async function loadTags() { try { S.tags = await getJSON("/api/scr/tags"); } catch (e) {} }
function openTagMenu(btn, t) {
  closeTagMenu();
  const have = new Set(tagsOf(t));
  const m = document.createElement("div"); m.className = "tagmenu"; m.id = "tagMenu"; m.dataset.for = t;
  m.innerHTML = `<div class="hdr">Tags for <b>${t}</b> (click to toggle)</div>` +
    S.tags.vocab.map(x => `<button data-tg="${x}" class="${have.has(x) ? "on" : ""}">${x}</button>`).join("") +
    `<input placeholder="new tag + Enter" maxlength="12">`;
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  m.style.top = Math.min(window.innerHeight - m.offsetHeight - 8, r.bottom + 4) + "px";
  m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r.right - m.offsetWidth)) + "px";
  m.onclick = async e => {
    const b = e.target.closest("button[data-tg]"); if (!b) return;
    b.classList.toggle("on");
    await saveTags(t, [...m.querySelectorAll("button.on")].map(x => x.dataset.tg));
  };
  m.querySelector("input").onkeydown = async e => {
    if (e.key === "Escape") return closeTagMenu();
    if (e.key !== "Enter") return;
    const nt = e.target.value.trim().replace(/[^A-Za-z0-9_\/-]/g, "").slice(0, 12);
    if (!nt) return;
    await saveTags(t, [...new Set([...tagsOf(t), nt])]);
    openTagMenu(btn, t);
  };
}
async function saveTags(t, list) {
  S.tags = await postJSON("/api/scr/tags", {ticker: t, tags: list});
  S.tagsDirty = true;
  if (typeof CHAN !== "undefined" && CHAN) CHAN.postMessage("changed");
}
function closeTagMenu() {
  const m = $("tagMenu"); if (m) m.remove();
  if (!S.tagsDirty) return;
  S.tagsDirty = false;
  document.querySelectorAll(".row[data-t]").forEach(r => {
    const t = r.dataset.t;
    r.querySelector(".tgs").innerHTML = tagChips(t);
    r.querySelector(".tagbtn").classList.toggle("has", tagsOf(t).length > 0);
  });
}

// ---- search: isolate matching tickers in every column (an exact match wins over prefix matches)
function applySearch() {
  const q = $("q").value.trim().toUpperCase();
  const rows = [...document.querySelectorAll(".row[data-t]")];
  const exact = q && rows.some(r => r.dataset.t === q);
  let n = 0;
  rows.forEach(r => {
    const hit = !q || (exact ? r.dataset.t === q : r.dataset.t.startsWith(q));
    r.classList.toggle("hide", !hit); r.classList.toggle("hit", !!q && hit); if (q && hit) n++;
    const nx = r.nextElementSibling; if (nx && nx.classList.contains("sumchart")) nx.classList.toggle("hide", !hit);
  });
  $("q").style.borderColor = q && !n ? "#f23645" : "";
  $("qMsg").textContent = !q ? "" : n ? `${n} match${n === 1 ? "" : "es"}` : `${q} didn't move on ${S.date}`;
}

async function init() {
  const D = await getJSON("/api/scr/dates");
  S.dates = D.dates;
  $("date").min = S.dates[0]; $("date").max = D.latest;
  $("mode").value = S.mode;
  const want = new URLSearchParams(location.search).get("date") || load("date", D.latest);
  const pick = d => { const i = S.dates.findIndex(x => x >= d); return i < 0 ? D.latest : S.dates[i]; };
  $("prev").onclick = () => S.prev && show(S.prev);
  $("next").onclick = () => S.next && show(S.next);
  $("latest").onclick = () => show(D.latest);
  $("date").onchange = () => $("date").value && show(pick($("date").value));
  $("mode").onchange = () => { S.mode = $("mode").value; keep("mode", S.mode); show(S.date); };
  $("q").addEventListener("input", applySearch);
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") applySearch(); if (e.key === "Escape") { $("q").value = ""; applySearch(); $("q").blur(); } });
  $("qGo").onclick = applySearch;
  $("qClr").onclick = () => { $("q").value = ""; applySearch(); };
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeTagMenu();
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "/") { e.preventDefault(); $("q").focus(); $("q").select(); return; }
    if (e.key === "ArrowLeft" && S.prev) show(S.prev);
    if (e.key === "ArrowRight" && S.next) show(S.next);
  });
  await loadTags();
  window.addEventListener("focus", async () => { if (!$("tagMenu")) { await loadTags(); S.tagsDirty = true; closeTagMenu(); } });
  await show(pick(want));
}
init().catch(e => { $("cols").innerHTML = `<div class="empty">Error: ${e.message}</div>`; });
</script>
</body>
</html>
